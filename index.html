  <body>
    <script>
      window.__showErr = function (msg) {
        var box = document.getElementById('errbox');
        if (!box) {
          box = document.createElement('div');
          box.id = 'errbox';
          box.style.cssText =
            'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#5941a9;color:#e5d4ed;padding:14px;font:14px/1.5 monospace;white-space:pre-wrap;word-break:break-word;';
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent = 'JS ERROR: ' + msg;
      };
      window.addEventListener('error', function (e) {
        window.__showErr(e.message + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        window.__showErr(String((r && (r.stack || r.message)) || r));
      });
    </script>
    <div id="root"></div>

    <div id="boot" role="status" aria-label="Loading portfolio" />

    <!-- no pre-React backdrop script: the boot canvas now lives in the React
         <BootScreen /> overlay, which mounts right after hydration -->
    <script type="module" src="/src/main.tsx"></script>
