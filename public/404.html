<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1d1128" />
    <title>404 — Page not found | Libin V M</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: #1d1128;
        color: #e5d4ed;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100svh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 1.25rem;
      }
      .number {
        font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
        font-size: clamp(5rem, 20vw, 10rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #e5d4ed;
        display: block;
      }
      .subtitle {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.6em;
        text-transform: uppercase;
        color: #b3a9bd;
        margin-top: 1rem;
        display: block;
      }
      .message {
        margin-top: 1.5rem;
        max-width: 42ch;
        color: #c7bbe2;
        font-size: clamp(0.95rem, 2.5vw, 1.1rem);
        line-height: 1.7;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 2rem;
        border-radius: 9999px;
        border: 1px solid rgba(229, 212, 237, 0.13);
        background: rgba(29, 17, 40, 0.7);
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        color: #e5d4ed;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        backdrop-filter: blur(12px);
        transition: border-color 0.2s, background-color 0.2s, transform 0.2s;
      }
      .btn:hover {
        border-color: rgba(109, 114, 195, 0.5);
        background: rgba(109, 114, 195, 0.1);
      }
      .btn:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <span class="number">404</span>
    <span class="subtitle">Page not found</span>
    <p class="message">
      The page you're looking for doesn't exist. Let's get you back on track.
    </p>
    <a href="/" class="btn">Back to home</a>
  </body>
</html>
